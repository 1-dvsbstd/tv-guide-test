name: Update LeCy EPG

on:
  push:
    paths:
      - "scripts/update_epg.py"
      - "lecy-channel-ids.csv"
      - ".github/workflows/update-epg.yml"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LeCy guide
        run: python3 scripts/update_epg.py
      - name: Commit updated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lecy-epg-test.xml
          git diff --cached --quiet || git commit -m "Update EPG guide"
          git push
